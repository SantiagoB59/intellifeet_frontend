<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 relative overflow-hidden bg-[#050816]">

  <!-- 🌌 FONDO -->
  <div class="absolute inset-0 bg-gradient-to-br from-[#050816] via-[#0B1A3A] to-[#020617]"></div>

  <!-- GLOW RESPONSIVE -->
  <div class="absolute w-[300px] h-[300px] sm:w-[600px] sm:h-[600px] bg-[#2F80ED]/20 blur-[120px] rounded-full top-[-100px] left-[-100px]"></div>
  <div class="absolute w-[250px] h-[250px] sm:w-[500px] sm:h-[500px] bg-blue-500/10 blur-[120px] rounded-full bottom-[-100px] right-[-100px]"></div>

  <!-- 🧊 CARD WRAPPER -->
  <div class="relative z-10 w-full max-w-md p-[1px] rounded-3xl bg-gradient-to-br from-[#2F80ED]/40 to-transparent">

    <!-- CARD -->
    <div class="relative bg-white rounded-3xl p-6 sm:p-10 space-y-6 sm:space-y-8 shadow-2xl transition-all duration-300 hover:scale-[1.01]">

      <!-- BORDE SUTIL -->
      <div class="absolute inset-0 rounded-3xl border border-blue-100 pointer-events-none"></div>

      <!-- LOGO -->
      <div class="text-center space-y-3 sm:space-y-4">
        <img src="assets/img/intellifeet.png" class="w-12 sm:w-14 mx-auto opacity-90">

        <h1 class="text-xl sm:text-2xl font-semibold text-slate-900 tracking-wide">
          Intelli<span class="text-[#2F80ED]">Fleet</span>
        </h1>

        <p class="text-[11px] sm:text-xs text-slate-500">
          Sistema inteligente de gestión de flotas
        </p>
      </div>

      <!-- TITLE -->
      <div class="text-center">
        <h2 class="text-base sm:text-lg text-slate-800 font-medium tracking-wide">
          Acceso seguro
        </h2>
        <p class="text-[11px] sm:text-xs text-slate-400">
          Autenticación protegida · Nivel corporativo
        </p>
      </div>

      <!-- ERROR -->
      <div *ngIf="isLoginFailed" class="text-red-500 text-sm text-center">
        Credenciales incorrectas
      </div>

      <!-- FORM -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5 sm:space-y-6">

        <!-- USER -->
        <div class="relative">
          <input
            formControlName="username"
            type="text"
            placeholder="Usuario"
            class="w-full px-4 py-3 sm:py-3.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:border-[#2F80ED] focus:ring-2 focus:ring-[#2F80ED]/30 outline-none transition"
          >
        </div>

        <!-- PASSWORD -->
        <div class="relative">
          <input
            [type]="showPass ? 'text' : 'password'"
            formControlName="password"
            placeholder="Contraseña"
            class="w-full px-4 py-3 sm:py-3.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:border-[#2F80ED] focus:ring-2 focus:ring-[#2F80ED]/30 outline-none transition"
          >

          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#2F80ED] transition"
          >
            <i class="fas" [ngClass]="showPass ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>

        <!-- OPTIONS -->
        <div class="flex justify-between text-xs text-slate-500">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="accent-[#2F80ED]">
            Recordarme
          </label>
        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full relative overflow-hidden bg-gradient-to-r from-[#2F80ED] to-blue-600 hover:from-[#1C5ED6] hover:to-blue-700 text-white py-3 sm:py-3.5 rounded-xl font-semibold text-sm sm:text-base transition flex justify-center items-center gap-2 shadow-lg shadow-blue-500/30 active:scale-[0.98]"
        >

          <!-- glow hover -->
          <span class="absolute inset-0 bg-white/20 opacity-0 hover:opacity-100 transition"></span>

          <span *ngIf="!isLoading">Iniciar sesión</span>

          <span *ngIf="isLoading" class="flex items-center gap-2">
            <i class="fas fa-circle-notch animate-spin"></i>
            Validando...
          </span>

        </button>

      </form>

      <!-- FOOTER -->
      <div class="text-center text-[10px] text-slate-400 pt-4 border-t border-slate-200">
        © 2026 IntelliFleet · SB Tech.
      </div>

    </div>
  </div>

</div>
